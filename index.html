<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="知练" />
    <title>知练 · AI 发电产业题库</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./public/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./public/icon-192.png" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="side-nav" aria-label="刷题模式">
        <a class="brand" href="#" aria-label="知练首页">
          <span class="brand-face" aria-hidden="true"><i></i><i></i><b></b></span>
          <span>知练</span>
        </a>

        <nav class="mode-list">
          <button class="mode-button active" data-mode="sequence" type="button"><span class="mode-icon">→</span><span>顺序练习</span></button>
          <button class="mode-button" data-mode="learn" type="button"><span class="mode-icon">◉</span><span>学习模式</span></button>
          <button class="mode-button" data-mode="random" type="button"><span class="mode-icon">⌁</span><span>随机练习</span></button>
          <button class="mode-button" data-mode="speed" type="button"><span class="mode-icon">⚡</span><span>速刷模式</span></button>
          <button class="mode-button" data-mode="exam" type="button"><span class="mode-icon">✓</span><span>模拟考试</span></button>
          <button class="mode-button" data-mode="wrong" type="button"><span class="mode-icon">↻</span><span>错题重练</span></button>
          <button class="mode-button" data-mode="favorite" type="button"><span class="mode-icon">★</span><span>我的收藏</span></button>
        </nav>

        <div class="side-foot">
          <span class="tiny-orb" aria-hidden="true">✓</span>
          <p><strong>离线可用</strong><span>进度自动保存在本机</span></p>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button id="mobileMenuButton" class="circle-button menu-button" type="button" aria-label="打开模式菜单">☰</button>
          <div>
            <p id="modeEyebrow" class="mode-eyebrow">顺序练习</p>
            <h1 id="modeTitle">稳稳向前，每题都算数</h1>
          </div>
          <div class="top-actions">
            <label class="search-control">
              <span aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="搜索题目" aria-label="搜索题目" />
            </label>
            <button id="settingsButton" class="circle-button" type="button" aria-label="练习设置">•••</button>
          </div>
        </header>

        <section id="settingsPanel" class="settings-panel hidden" aria-label="练习设置">
          <div>
            <strong>题型</strong>
            <div class="type-filters">
              <label><input type="checkbox" value="single" checked /><span>单选</span></label>
              <label><input type="checkbox" value="multiple" checked /><span>多选</span></label>
              <label><input type="checkbox" value="judge" checked /><span>判断</span></label>
              <label><input type="checkbox" value="essay" checked /><span>论述</span></label>
            </div>
          </div>
          <div class="jump-control">
            <label for="jumpInput">跳到题号</label>
            <input id="jumpInput" inputmode="numeric" placeholder="如 128" />
            <button id="jumpButton" type="button">前往</button>
          </div>
          <button id="resetProgressButton" class="text-button danger" type="button">重置全部进度</button>
        </section>

        <div class="content-grid">
          <section id="questionShell" class="question-shell" aria-live="polite">
            <div class="progress-head">
              <span id="typeBadge">单选题</span>
              <strong id="positionText">1 / 1000</strong>
            </div>
            <div class="question-progress" aria-hidden="true"><span></span></div>

            <div class="question-head">
              <h2 id="questionTitle"></h2>
              <button id="favoriteButton" class="favorite-button" type="button" aria-label="收藏本题" aria-pressed="false">☆</button>
            </div>

            <div id="optionList" class="option-list"></div>

            <div id="essayArea" class="essay-area hidden">
              <textarea id="essayDraft" placeholder="写下你的作答要点…"></textarea>
              <button id="markEssayWrong" class="text-button" type="button">加入错题重练</button>
            </div>

            <div id="feedbackBox" class="feedback-box hidden"></div>
            <div id="answerPanel" class="answer-panel hidden">
              <span>正确答案</span>
              <p id="answerText"></p>
            </div>

            <footer class="question-actions">
              <button id="prevButton" class="nav-button" type="button" aria-label="上一题">←</button>
              <span class="keyboard-tip">按数字键选答案 · Enter 确认</span>
              <button id="submitButton" class="primary-button" type="button">确认答案</button>
              <button id="nextButton" class="nav-button" type="button" aria-label="下一题">→</button>
            </footer>
          </section>

          <aside class="focus-panel" aria-label="今日学习数据">
            <div class="streak-card">
              <span class="streak-icon" aria-hidden="true">⚡</span>
              <div><strong id="streakCount">0</strong><span>连续答对</span></div>
            </div>
            <div class="today-head"><strong>今天</strong><span id="todayDate"></span></div>
            <div class="metric-list">
              <div><span>已完成</span><strong id="doneCount">0 <small>题</small></strong></div>
              <div><span>正确率</span><strong id="accuracyText">0%</strong></div>
              <div><span>错题</span><strong id="wrongCount">0</strong></div>
              <div><span>收藏</span><strong id="favCount">0</strong></div>
            </div>
            <div class="daily-goal">
              <div><strong>每日目标</strong><span id="goalText">0 / 30</span></div>
              <div class="goal-track"><span id="goalProgress"></span></div>
            </div>
            <p id="modeHint" class="mode-hint">按题库顺序稳步推进，适合系统复习。</p>
          </aside>
        </div>
      </main>
    </div>

    <script src="./src/questionBank.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
